name: Athidi CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: athidi
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d athidi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/athidi
          DB_USERNAME: postgres
          DB_PASSWORD: ""

      - name: Build application
        run: mvn package -DskipTests

      - name: Build Docker image
        run: docker build -t athidi-backend .